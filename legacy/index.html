<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genre Coach</title>
<meta name="description" content="Genre Coach – erkenne den Sound: Drum &amp; Bass, Techno oder Psytrance.">
<meta name="theme-color" content="#0C0A18">

<!-- Vorschau beim Teilen des Links (WhatsApp, iMessage, Signal, Slack, Facebook …) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Genre Coach">
<meta property="og:title" content="Genre Coach – erkenne den Sound">
<meta property="og:description" content="Drum &amp; Bass, Techno oder Psytrance: Hör kurze Clips, errate das Subgenre und knack den Highscore.">
<meta property="og:url" content="https://bejewelled-sorbet-021429.netlify.app/">
<meta property="og:image" content="https://bejewelled-sorbet-021429.netlify.app/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Genre Coach – Retro-Ratespiel für Drum &amp; Bass, Techno und Psytrance">
<meta property="og:locale" content="de_DE">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 7 6' shape-rendering='crispEdges'%3E%3Cpath fill='%23FF4FA0' d='M1 0h2v1H1zM4 0h2v1H4zM0 1h7v2H0zM1 3h5v1H1zM2 4h3v1H2zM3 5h1v1H3z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0C0A18;
    --card: #120F22;
    --text: #EDE7FF;
    --muted: #8C84B8;
    --dnb: #B6F04A;   --dnb-shadow: #4C6A12;
    --techno: #3FE0D0; --techno-shadow: #146A63;
    --psy: #FF4FA0;   --psy-shadow: #7A1E4C;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background-color: var(--bg);
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 2px, transparent 2px, transparent 5px);
    color: var(--text);
    font-family: 'Press Start 2P', ui-monospace, monospace;
    -webkit-font-smoothing: none;
    display: flex;
    flex-direction: column;
    padding: clamp(24px, 5vw, 56px) clamp(20px, 5vw, 64px);
  }

  .hud {
    display: flex;
    justify-content: space-between;
    font-size: clamp(10px, 1.3vw, 16px);
    color: var(--muted);
  }

  main {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 0;
  }

  h1 {
    margin: 0;
    font-size: clamp(40px, 7.5vw, 96px);
    line-height: 1.2;
    letter-spacing: 0.04em;
    text-align: center;
    color: #FFFFFF;
    text-shadow: -0.06em 0 0 var(--psy), 0.06em 0 0 var(--techno);
  }
  h1 .line { display: inline; }

  .tagline {
    margin: 24px 0 56px;
    font-size: clamp(11px, 1.3vw, 16px);
    color: var(--muted);
    text-align: center;
  }

  .genres {
    list-style: none;
    margin: 0;
    padding: 0 8px 8px 0;
    display: flex;
    gap: 40px;
  }

  .card {
    --c: var(--text); --s: #333;
    width: 300px;
    min-height: 200px;
    background: var(--card);
    border: 6px solid var(--c);
    box-shadow: 8px 8px 0 var(--s);
    color: var(--c);
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 28px 24px;
    transition: transform .12s steps(2), box-shadow .12s steps(2);
  }
  .card:hover, .card:focus-visible {
    transform: translate(-4px, -8px);
    box-shadow: 12px 16px 0 var(--s);
    outline: none;
  }
  .card:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 var(--s); }
  .card.dnb    { --c: var(--dnb);    --s: var(--dnb-shadow); }
  .card.techno { --c: var(--techno); --s: var(--techno-shadow); }
  .card.psy    { --c: var(--psy);    --s: var(--psy-shadow); }

  .name { font-size: 26px; line-height: 1.4; text-align: center; }
  .bpm  { font-size: 13px; color: var(--text); }

  footer {
    text-align: center;
    font-size: clamp(12px, 1.3vw, 16px);
  }
  @keyframes blink { 50% { opacity: 0; } }
  .blink { animation: blink 1.1s steps(1) infinite; }

  /* Mobil: Kacheln untereinander, Headline zweizeilig */
  @media (max-width: 900px) {
    h1 .line { display: block; }
    .tagline { margin: 20px 0 40px; }
    .genres {
      flex-direction: column;
      gap: 22px;
      width: 100%;
      max-width: 420px;
      padding: 0 6px 6px 0;
    }
    .card {
      width: 100%;
      min-height: 96px;
      flex-direction: row;
      justify-content: space-between;
      gap: 12px;
      padding: 0 22px;
      border-width: 5px;
      box-shadow: 6px 6px 0 var(--s);
    }
    .card:hover, .card:focus-visible {
      transform: translate(-3px, -3px);
      box-shadow: 9px 9px 0 var(--s);
    }
    .name { font-size: clamp(14px, 4.4vw, 18px); text-align: left; }
    .name br { display: none; }
    .bpm  { font-size: 9px; white-space: nowrap; }
  }

  @media (prefers-reduced-motion: reduce) {
    .blink { animation: none; }
    .card { transition: none; }
  }

  /* Sprachumschalter (rechts oben) */
  .hud { align-items: center; }
  .ldd { position: relative; }
  .ldd-btn {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    font: inherit; font-size: clamp(9px, 1vw, 12px); color: var(--muted);
    background: var(--bg); border: 3px solid #3A3460; padding: 4px 9px 4px 5px;
  }
  .ldd-btn:hover, .ldd-btn:focus-visible, .ldd.open .ldd-btn { color: var(--text); outline: none; }
  .ldd-btn .chev { font-size: .8em; transition: transform .1s; }
  .ldd.open .ldd-btn .chev { transform: rotate(180deg); }
  .flag { width: 18px; height: 18px; border-radius: 50%; overflow: hidden; flex: none; display: inline-block; box-shadow: 0 0 0 2px rgba(255,255,255,.12); }
  .flag svg { width: 100%; height: 100%; display: block; }
  .ldd-menu {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 10; min-width: 200px;
    background: var(--bg); border: 3px solid #3A3460; box-shadow: 5px 5px 0 rgba(0,0,0,.35); padding: 6px;
  }
  .ldd-menu[hidden] { display: none; }
  .ldd-menu button {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; cursor: pointer; text-align: left;
    font: inherit; font-size: 11px; line-height: 1.4; color: var(--text); background: none; border: none;
  }
  .ldd-menu button:hover, .ldd-menu button:focus-visible { background: rgba(182,240,74,.1); outline: none; }
  .ldd-menu button[aria-selected="true"] { color: var(--dnb); }
  .ldd-menu .flag { width: 22px; height: 22px; }
  .ldd-menu .ck { margin-left: auto; color: var(--dnb); }
</style>
</head>
<body>
  <div class="hud">
    <span aria-hidden="true">1UP 000000</span>
    <div class="ldd" id="ldd">
      <button class="ldd-btn" id="ldd-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="ldd-menu" aria-label="Sprache / Language">
        <span class="flag" id="ldd-flag"></span><span id="ldd-code">DE</span><span class="chev" aria-hidden="true">▼</span>
      </button>
      <div class="ldd-menu" id="ldd-menu" role="listbox" aria-label="Sprache / Language" hidden>
        <button type="button" role="option" data-lang="de"></button>
        <button type="button" role="option" data-lang="en"></button>
      </div>
    </div>
  </div>

  <main>
    <h1><span class="line">GENRE</span> <span class="line">COACH</span></h1>
    <p class="tagline" data-i18n="tagline">ERKENNE DEN SOUND</p>

    <ul class="genres">
      <li>
        <a class="card dnb" href="https://eclectic-yeot-5a7d9e.netlify.app">
          <span class="name">DRUM<br> &amp; BASS</span>
          <span class="bpm">~174 BPM</span>
        </a>
      </li>
      <li>
        <a class="card techno" href="https://funny-kitsune-016651.netlify.app">
          <span class="name">TECHNO</span>
          <span class="bpm">~130 BPM</span>
        </a>
      </li>
      <li>
        <a class="card psy" href="https://tourmaline-paletas-cd8834.netlify.app">
          <span class="name">PSYTRANCE</span>
          <span class="bpm">~145 BPM</span>
        </a>
      </li>
    </ul>
  </main>

  <footer><span class="blink" data-i18n="footer">WÄHLE EIN GENRE</span></footer>

<script>
  // Sprache: ?lang=de|en > zuletzt gewählt > Browsersprache. Die Wahl wird an die Spiel-Links angehängt.
  (function () {
    var TEXT = {
      de: { name: "Deutsch", tagline: "ERKENNE DEN SOUND", footer: "WÄHLE EIN GENRE" },
      en: { name: "English", tagline: "NAME THAT SOUND",  footer: "PICK A GENRE" }
    };
    var uid = 0;
    function flag(l) {
      if (l === "de") return '<svg viewBox="0 0 5 3" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="5" height="1" fill="#000"/><rect y="1" width="5" height="1" fill="#DD0000"/><rect y="2" width="5" height="1" fill="#FFCE00"/></svg>';
      var id = "ukclip" + (++uid);
      return '<svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><clipPath id="' + id + '"><path d="M30,15h30v15zv15h-30zh-30v-15zv-15h30z"/></clipPath><rect width="60" height="30" fill="#012169"/><path d="M0,0L60,30M60,0L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0L60,30M60,0L0,30" clip-path="url(#' + id + ')" stroke="#C8102E" stroke-width="4"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/></svg>';
    }
    function initial() {
      var l = new URLSearchParams(location.search).get("lang");
      if (l !== "de" && l !== "en") { try { l = localStorage.getItem("gc-lang"); } catch (e) { l = null; } }
      if (l !== "de" && l !== "en") l = (navigator.language || "").toLowerCase().indexOf("de") === 0 ? "de" : "en";
      return l;
    }
    var box = document.getElementById("ldd"), btn = document.getElementById("ldd-btn"), menu = document.getElementById("ldd-menu");
    var opts = Array.prototype.slice.call(menu.querySelectorAll("button"));
    var cards = Array.prototype.slice.call(document.querySelectorAll(".card"));
    cards.forEach(function (c) { c.dataset.base = c.getAttribute("href").split("?")[0]; });
    opts.forEach(function (o) {
      var l = o.dataset.lang;
      o.innerHTML = '<span class="flag">' + flag(l) + '</span>' + TEXT[l].name + '<span class="ck" aria-hidden="true"></span>';
      o.addEventListener("click", function () { apply(l, true); close(true); });
    });
    function apply(l, save) {
      document.documentElement.lang = l;
      document.getElementById("ldd-flag").innerHTML = flag(l);
      document.getElementById("ldd-code").textContent = l.toUpperCase();
      document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = TEXT[l][el.dataset.i18n]; });
      opts.forEach(function (o) {
        var on = o.dataset.lang === l;
        o.setAttribute("aria-selected", on ? "true" : "false");
        o.querySelector(".ck").textContent = on ? "✓" : "";
      });
      cards.forEach(function (c) { c.href = c.dataset.base + "?lang=" + l; });
      if (save) { try { localStorage.setItem("gc-lang", l); } catch (e) {} }
    }
    function open() { box.classList.add("open"); menu.hidden = false; btn.setAttribute("aria-expanded", "true"); (menu.querySelector('[aria-selected="true"]') || opts[0]).focus(); }
    function close(refocus) { box.classList.remove("open"); menu.hidden = true; btn.setAttribute("aria-expanded", "false"); if (refocus) btn.focus(); }
    btn.addEventListener("click", function () { menu.hidden ? open() : close(false); });
    document.addEventListener("click", function (e) { if (!box.contains(e.target)) close(false); });
    menu.addEventListener("keydown", function (e) {
      var i = opts.indexOf(document.activeElement);
      if (e.key === "Escape") { e.preventDefault(); close(true); }
      else if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); e.stopPropagation(); opts[(i + (e.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length].focus(); }
    });
    apply(initial(), false);
  })();

  // Arcade-Steuerung: Pfeiltasten wechseln zwischen den Genres, Enter startet.
  (function () {
    var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
    document.addEventListener('keydown', function (e) {
      var keys = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'];
      if (keys.indexOf(e.key) === -1) return;
      if (document.activeElement && document.activeElement.closest && document.activeElement.closest('.ldd')) return;
      e.preventDefault();
      var i = cards.indexOf(document.activeElement);
      var step = (e.key === 'ArrowLeft' || e.key === 'ArrowUp') ? -1 : 1;
      var next = i === -1 ? 0 : (i + step + cards.length) % cards.length;
      cards[next].focus();
    });
  })();
</script>
</body>
</html>
