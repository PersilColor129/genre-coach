<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Genre Coach – Techno · Survival</title>
<meta name="theme-color" content="#0C0A18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0A18; --card:#120F22; --text:#EDE7FF; --muted:#8C84B8;
  --c:#3FE0D0; --s:#146A63;            /* Techno-Akzent wie auf der Startseite */
  --ok:#3FE0D0; --ok-s:#146A63;
  --bad:#FF4FA0; --bad-s:#7A1E4C;
  --heart:#FF4FA0; --heart-s:#7A1E4C;
  --c2:#B6F04A; --c2-s:#4C6A12;   /* Zweitfarbe: Multiplikator, laufender Clip, Überschriften */
  --c-tint:rgba(63,224,208,.1);
  --px:'Press Start 2P', ui-monospace, monospace;
  --sans:'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; min-height:100vh; min-height:100dvh;
  background-color:var(--bg);
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0,rgba(255,255,255,.035) 2px,transparent 2px,transparent 5px);
  color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; align-items:center;
  padding:clamp(20px,4vw,48px) 16px;
}
.back{align-self:flex-start;color:var(--muted);text-decoration:none;font-family:var(--px);font-size:10px;margin-bottom:24px}
.back:hover,.back:focus-visible{color:var(--c);outline:none}
.card{
  background:var(--card); width:100%; max-width:520px;
  border:6px solid var(--c); box-shadow:8px 8px 0 var(--s);
  padding:24px 22px 26px; margin-right:8px;
}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px;font-family:var(--px);font-size:10px;line-height:1.6}
.brand{color:var(--c)}
.score{color:var(--muted);white-space:nowrap}.score b{color:var(--text);font-weight:400}
.q{text-align:center;font-size:clamp(20px,5vw,24px);font-weight:700;line-height:1.3;margin:4px 0 26px}
.q i{font-style:normal;color:var(--c)}
.btn{
  display:block;width:100%;padding:16px 12px;cursor:pointer;
  font-family:var(--sans);font-size:clamp(17px,4.4vw,19px);font-weight:700;line-height:1.3;
  color:var(--text);background:var(--bg);
  border:4px solid var(--text);box-shadow:5px 5px 0 #3A3460;
  transition:transform .1s steps(2),box-shadow .1s steps(2);
}
.btn:not(:disabled):hover,.btn:not(:disabled):focus-visible{transform:translate(-2px,-3px);box-shadow:7px 8px 0 #3A3460;border-color:var(--c);color:var(--c);outline:none}
.btn:not(:disabled):active{transform:translate(3px,3px);box-shadow:2px 2px 0 #3A3460}
.btn:disabled{cursor:default;opacity:.55}
.btn.ok{opacity:1;border-color:var(--ok);color:var(--bg);background:var(--ok);box-shadow:5px 5px 0 var(--ok-s)}
.btn.bad{opacity:1;border-color:var(--bad);color:var(--bg);background:var(--bad);box-shadow:5px 5px 0 var(--bad-s)}
.or{text-align:center;color:var(--muted);font-size:15px;margin:12px 0}
.play{
  display:flex;align-items:center;justify-content:center;margin:0 auto 30px;
  width:96px;height:96px;cursor:pointer;border-radius:50%;
  font-family:var(--sans);font-size:42px;line-height:1;padding:0 0 0 6px;color:var(--bg);
  background:var(--c);border:none;box-shadow:6px 6px 0 var(--s);
  transition:transform .1s steps(2),box-shadow .1s steps(2);
}
.play:hover,.play:focus-visible{transform:translate(-2px,-3px);box-shadow:8px 9px 0 var(--s);outline:none}
.play.on{background:var(--c2);box-shadow:6px 6px 0 var(--c2-s);animation:pulse .5s steps(2) infinite}
@keyframes pulse{50%{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--c2-s)}}
.clip{display:flex;align-items:center;gap:14px;border:4px solid #3A3460;padding:12px;background:var(--bg)}
.clip .play{width:58px;height:58px;font-size:26px;padding:0 0 0 4px;margin:0;flex:none;box-shadow:4px 4px 0 var(--s)}
.clip span{flex:1;font-size:18px;font-weight:700}
.clip .btn{width:auto;padding:10px 14px;font-size:15px;box-shadow:3px 3px 0 #3A3460;border-width:3px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px}
.dots{display:flex;gap:10px;align-items:center}
.dot{width:12px;height:12px;background:#3A3460}
.dot.cur{background:var(--text);animation:blink 1.1s steps(1) infinite}
.dot.r{background:var(--ok)}.dot.w{background:var(--bad)}
.link{background:none;border:none;color:var(--muted);font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:.06em;cursor:pointer;padding:8px 0}
.link:hover,.link:focus-visible{color:var(--c);outline:none}
.reveal{margin-top:18px;text-align:center;color:var(--muted);font-size:15px;line-height:1.45}
.reveal:not(:empty){border-top:3px solid #241F40;padding-top:14px}
.reveal a{color:var(--text);text-decoration:underline;text-decoration-color:var(--c);text-underline-offset:3px}
.reveal a::after{content:" ↗";color:var(--c);font-size:.85em}
.reveal a:hover,.reveal a:focus-visible{color:var(--c);outline:none}
.reveal .src{display:block;margin-top:6px;font-size:12px;color:var(--muted);opacity:.8}
.primary{
  font-family:var(--px);font-size:12px;cursor:pointer;
  color:var(--bg);background:var(--c);border:none;padding:14px 18px;
  box-shadow:5px 5px 0 var(--s);transition:transform .1s steps(2),box-shadow .1s steps(2);
}
.primary:hover,.primary:focus-visible{transform:translate(-2px,-3px);box-shadow:7px 8px 0 var(--s);outline:none}
.primary:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--s)}
.res{display:flex;align-items:center;gap:20px;margin-bottom:26px}
.res .t1{color:var(--muted);font-family:var(--px);font-size:10px;margin-bottom:12px}
.res .t2{font-size:clamp(24px,6vw,30px);font-weight:700;line-height:1.15;color:var(--c)}
.bar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:96px;flex:none}
.bar span{height:22px;background:#3A3460}.bar span.on{background:var(--c)}
.big{font-size:24px;font-weight:700;text-align:center;margin-top:8px}
details{border-top:4px solid #3A3460;padding:16px 2px}
summary{cursor:pointer;font-size:17px;font-weight:500;line-height:1.4;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";color:var(--muted)}
details[open] summary::before{content:"▾ "}
.mk-ok{color:var(--ok)}.mk-bad{color:var(--bad)}
.why{font-size:16px;line-height:1.55}
.why h4{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--c2);margin:18px 0 10px}
.why p{margin:0 0 12px}.lbl{color:var(--muted)}
.why p.mk-ok,.why p.mk-bad{font-size:17px;font-weight:700;margin:12px 0 6px}
.why a{color:var(--c)}
.center{text-align:center;color:var(--muted);padding:6px 0 28px;font-size:17px;line-height:1.5}
.start-title{font-size:clamp(28px,7.5vw,36px);font-weight:700;line-height:1.15;text-align:center;margin:6px 0 18px;color:#fff;text-shadow:-2px 0 0 var(--bad),2px 0 0 var(--c2)}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (max-width:420px){.card{border-width:5px;box-shadow:6px 6px 0 var(--s);padding:20px 16px}.top{font-size:9px}}
@media (prefers-reduced-motion:reduce){.blink,.dot.cur,.play.on{animation:none}*{transition:none!important}}
/* --- Survival-Modus --- */
.lives{display:flex;gap:6px;font-family:var(--sans);font-size:18px;line-height:1}
.heart{color:var(--heart);text-shadow:2px 2px 0 var(--heart-s)}
.heart.lost{color:#3A3460;text-shadow:none}
.meta{display:flex;justify-content:space-between;align-items:center;font-family:var(--px);font-size:9px;color:var(--muted);margin-bottom:10px}
.mult{color:var(--muted)}.mult.hot{color:var(--bg);background:var(--c2);padding:5px 7px;box-shadow:3px 3px 0 var(--c2-s)}
.timerbar{height:8px;background:#3A3460;margin-bottom:24px}
#timer{height:100%;background:var(--c);transform-origin:left;transform:scaleX(1);transition:transform .1s linear}
#timer.low{background:var(--bad)}
.hint{text-align:center;color:var(--muted);font-size:15px;line-height:1.3;margin:14px 0 0;min-height:20px}
.gain{color:var(--ok);font-weight:700;font-size:22px;line-height:1}
.loss{color:var(--bad);font-weight:700;font-size:22px;line-height:1}
.streak{font-family:var(--px);font-size:9px;line-height:1;color:var(--c2)}
.go{font-family:var(--px);font-size:clamp(20px,6vw,28px);text-align:center;color:#fff;margin:6px 0 22px;text-shadow:-2px 0 0 var(--bad),2px 0 0 var(--c2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.stats div{background:var(--bg);border:3px solid #3A3460;padding:12px 6px;text-align:center}
.stats b{display:block;font-size:20px;color:var(--c)}
.stats span{font-size:13px;color:var(--muted)}
.newhi{font-family:var(--px);font-size:12px;text-align:center;color:var(--c2);margin:0 0 10px}
.initials{display:flex;justify-content:center;gap:18px}
.slot{display:flex;flex-direction:column;align-items:center;gap:12px}
.arr{
  width:52px;height:52px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--sans);font-size:20px;line-height:1;
  color:var(--c);background:transparent;border:3px solid var(--c);box-shadow:4px 4px 0 var(--s);
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;
  transition:transform .08s steps(2),box-shadow .08s steps(2);
}
.arr:hover,.arr:focus-visible{outline:none;background:var(--c-tint)}
.arr:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--s)}
.ch{width:62px;height:72px;display:flex;align-items:center;justify-content:center;font-family:var(--px);font-size:30px;background:var(--bg);border:4px solid #3A3460;cursor:pointer;outline:none}
.slot.act .ch{border-color:var(--c);color:var(--c);box-shadow:4px 4px 0 var(--s)}
.sub{font-family:var(--px);font-size:11px;color:var(--c2);margin:6px 0 14px;text-align:center}
.board{list-style:none;margin:0 0 6px;padding:0;border:3px solid #3A3460;background:var(--bg)}
.board li{display:flex;gap:14px;align-items:center;padding:9px 14px;font-family:var(--px);font-size:12px}
.board li+li{border-top:2px solid #241F40}
.board .rk{color:var(--muted)}.board .nm{flex:1}.board .pt{color:var(--c)}
.board li.me{background:var(--c);color:var(--bg)}.board li.me .rk,.board li.me .pt{color:var(--bg)}
.empty{text-align:center;color:var(--muted);font-size:15px;border:3px dashed #3A3460;padding:16px;margin:0 0 6px}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:24px}
.ghost{
  display:inline-block;text-align:center;text-decoration:none;cursor:pointer;
  font-family:var(--px);font-size:12px;line-height:1.2;
  color:var(--c);background:transparent;border:4px solid var(--c);padding:10px 14px;
  box-shadow:5px 5px 0 var(--s);transition:transform .1s steps(2),box-shadow .1s steps(2);
}
.ghost:hover,.ghost:focus-visible{transform:translate(-2px,-3px);box-shadow:7px 8px 0 var(--s);background:var(--c-tint);outline:none}
.ghost:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--s)}
.rules{margin:0 0 26px}
.rules p{display:flex;gap:12px;align-items:baseline;margin:0 0 12px;font-size:16px;line-height:1.45;color:var(--text)}
.rules b{flex:none;width:58px;color:var(--c);font-size:15px}
/* Mobil: Weiter-Button über die volle Breite */
@media (max-width:600px){
  .foot{flex-wrap:wrap;justify-content:center;gap:8px 12px;margin-top:10px}
  .foot .primary{width:100%;order:2;padding:16px}
  .foot .streak{width:100%;text-align:center;order:1}
  .foot .streak:empty{display:none}
  .play{width:84px;height:84px;font-size:36px;margin-bottom:22px}
  .q{margin-bottom:20px}
  .timerbar{margin-bottom:18px}
  .top{margin-bottom:20px}
  .actions{flex-direction:column;gap:14px}
  .actions .primary{width:100%;padding:16px}
  .actions .ghost{width:100%;padding:12px 16px}
}
</style>
</head>

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function fetchBoard() {
  try {
    const r = await fetch(`${SB_URL}/rest/v1/highscores?select=id,name,score&game=eq.${GAME_ID}&order=score.desc,created_at.asc&limit=${BOARD_SIZE}`, { headers: SB_HEADERS });
    if (!r.ok) throw new Error("HTTP " + r.status);
    board = await r.json(); boardOk = true;
  } catch (e) { boardOk = false; }
  return boardOk;
}
async function submitScore(name) {
  const r = await fetch(`${SB_URL}/rest/v1/highscores`, {
    method: "POST",
    headers: { ...SB_HEADERS, Prefer: "return=representation" },
    body: JSON.stringify({ game: GAME_ID, name, score: game.score, correct: game.correct })
  });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const [row] = await r.json();
  return row.id;
}
function qualifies(score) {
  return score > 0 && (board.length < BOARD_SIZE || score > board[board.length - 1].score);
}
function boardHTML(highlightId) {
  if (boardOk === null) return `<p class="empty">${tr("boardLoading")}</p>`;
  if (boardOk === false) return `<p class="empty">${tr("boardDown")}</p>`;
  if (!board.length) return `<p class="empty">${tr("boardEmpty")}</p>`;
  return '<ol class="board">' + board.map((e, i) =>

  ).join("") + "</ol>";
}

// ---------- Audio ----------
function play(url, btn, onStart) {
  if (playingBtn === btn) { stop(); return; }
  stop();
  audio.src = url;
  audio.onloadedmetadata = () => { audio.currentTime = Math.max(0, Math.min(8, audio.duration - 12)); };
  audio.onerror = () => {
    stop();
    const rv = document.getElementById("rv");
    if (rv && !rv.textContent) rv.textContent = tr("clipError");
    if (q && !q.done) q.broken = true;
  };
  audio.play().catch(() => {});
  btn.classList.add("on"); btn.textContent = "■"; playingBtn = btn;
  stopTimer = setTimeout(stop, 12000);
  if (onStart) onStart();
}
function stop() {
  audio.pause(); clearTimeout(stopTimer);
  if (playingBtn) { playingBtn.classList.remove("on"); playingBtn.textContent = "▶"; playingBtn = null; }
}

// ---------- Fragen ----------
function pick(g) {
  let free = POOL[g].filter(t => !game.used.has(t.preview));
  if (!free.length) { POOL[g].forEach(t => game.used.delete(t.preview)); free = POOL[g].slice(); }
  const t = free[Math.floor(Math.random() * free.length)];
  game.used.add(t.preview);
  return t;
}
function nextQuestion() {
  const [g1, g2] = shuffle([...KEYS]);
  if (Math.random() < 0.75) q = { type: "listen", correct: g1, other: g2, options: shuffle([g1, g2]), list: [pick(g1)] };
  else q = { type: "pick", correct: g1, other: g2, list: shuffle([pick(g1), pick(g2)]) };
  q.started = null; q.done = false;
  game.n++;
  showQuestion();
}

  q.started = performance.now();
  view.querySelectorAll(".opt").forEach(b => b.disabled = false);
  const hint = document.getElementById("hint"); if (hint) hint.textContent = "";
  clearInterval(tick);
  tick = setInterval(() => {
    const el = document.getElementById("timer");
    if (!el || q.done) { clearInterval(tick); return; }
    const left = Math.max(0, 1 - (performance.now() - q.started) / 1000 / BONUS_TIME);
    el.style.transform = `scaleX(${left})`;
    el.classList.toggle("low", left < .3);
    if (left === 0) clearInterval(tick);
  }, 100);
}

function multiplier() { return Math.min(4, 1 + Math.floor(game.streak / 3)); }

function showQuestion() {
  drawHud();
  const mult = multiplier();
  let html = `<div class="meta"><span>${tr("question", game.n)}</span><span class="mult ${mult > 1 ? "hot" : ""}">×${mult}</span></div>
    <div class="timerbar"><div id="timer"></div></div>`;
  if (q.type === "listen") {
    html += `<p class="q">${tr("qListen")}</p><button class="play" id="pl" aria-label="${tr("playClip")}">▶</button>` +
      q.options.map((g, i) => (i ? `<div class="or">${tr("or")}</div>` : "") + `<button class="btn opt" data-g="${g}" disabled>${GENRES[g].name}</button>`).join("");
  } else {
    html += `<p class="q">${tr("qPick", `<i>${GENRES[q.correct].name}</i>`)}</p>` +
      q.list.map((c, i) => (i ? `<div class="or">${tr("or")}</div>` : "") +
        `<div class="clip"><button class="play" data-i="${i}" aria-label="${tr("playClipX", "AB"[i])}">▶</button><span>${tr("clip")} ${"AB"[i]}</span><button class="btn opt" data-g="${c.genre}" disabled>${tr("thisOne")}</button></div>`).join("");
  }
  view.innerHTML = html + `<p class="hint" id="hint">${tr("hintPlay")}</p>
    <div class="foot" id="ft"><span class="streak">${game.streak ? tr("streak", game.streak) : ""}</span><button class="link" id="skip">${tr("skip")}</button></div>
    <div class="reveal" id="rv"></div>`;
  if (q.type === "listen") { const b = document.getElementById("pl"); b.onclick = () => play(q.list[0].preview, b, startClock); }
  else view.querySelectorAll(".clip .play").forEach(b => b.onclick = () => play(q.list[b.dataset.i].preview, b, startClock));
  view.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(b.dataset.g));
  document.getElementById("skip").onclick = () => answer(null);
}

function answer(g) {
  if (q.done) return;
  q.done = true; clearInterval(tick);
  const ok = g === q.correct;
  const secs = q.started ? (performance.now() - q.started) / 1000 : BONUS_TIME;
  let gained = 0, msg;
  if (ok) {
    const bonus = Math.round(BONUS_MAX * Math.max(0, 1 - secs / BONUS_TIME));
    const mult = multiplier();
    gained = (BASE + bonus) * mult;
    game.score += gained; game.correct++; game.streak++;
    game.best = Math.max(game.best, game.streak);
    msg = `<span class="gain">+${gained}</span> <span class="lbl">${BASE} + ${bonus} ${tr("bonus")}${mult > 1 ? " × " + mult : ""}</span>`;
  } else {
    game.streak = 0;
    if (g === null && q.broken) { msg = `<span class="lbl">${tr("skippedFree")}</span>`; }
    else {
      game.lives--;
      msg = `<span class="loss">−1 ♥</span> <span class="lbl">${g === null ? tr("skipped") : tr("wrong")}</span>`;
      game.misses.push(q);
    }
  }
  q.chosen = g;
  drawHud();
  view.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    if (b.dataset.g === q.correct) b.classList.add("ok");
    else if (b.dataset.g === g) b.classList.add("bad");
  });
  document.getElementById("hint").innerHTML = msg;
  document.getElementById("rv").innerHTML = q.list.map((t, i) =>
    (q.type === "pick" ? `${tr("clip")} ${"AB"[i]}: ${GENRES[t.genre].name} · ` : "") +
    `<a href="${t.link}" target="_blank" rel="noopener">${esc(t.artist)} – ${esc(t.title)}</a>`).join("<br>") +
    `<span class="src">${tr("source")}</span>`;
  const over = game.lives <= 0;
  document.getElementById("ft").innerHTML = `<span class="streak">${game.streak ? tr("streak", game.streak) : ""}</span><button class="primary" id="nx">${over ? "GAME OVER ▸" : tr("next")}</button>`;
  const nx = document.getElementById("nx");
  nx.onclick = () => { stop(); over ? gameOver() : nextQuestion(); };
  nx.focus({ preventScroll: true });
}

// ---------- Erklärungen zu den Fehlern ----------
function explain(q, i) {
  const C = GENRES[q.correct], W = GENRES[q.other];
  const title = q.type === "listen" ? tr("wasThat") : tr("qPick", C.name);
  return `<details ${i === 0 ? "open" : ""}><summary><span class="mk-bad">✗</span> ${title}${q.chosen === null ? ` <span class="lbl">${tr("skippedParen")}</span>` : ""}</summary>
    <div class="why">
      <p class="mk-ok">✓ ${C.name}</p><p class="mk-bad">✗ ${W.name}</p>
      <h4>${tr("why")}</h4>
      <p><span class="lbl">${tr("whatMakes", C.name)}</span><br>${C.desc}</p>
      <p><span class="lbl">${tr("howRecognize", W.name)}</span><br>${W.desc}</p>
      ${q.list.map(t => `<p class="lbl">${tr("heard", GENRES[t.genre].name)}: <a href="${t.link}" target="_blank" rel="noopener">${esc(t.artist)} – ${esc(t.title)}</a></p>`).join("")}
    </div></details>`;
}

// ---------- Game Over & Namenseintrag ----------
const ABC = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
async function gameOver() {
  stop();
  const stats = `<div class="stats">
      <div><b>${pad(game.score)}</b><span>${tr("points")}</span></div>
      <div><b>${game.correct}</b><span>${tr("correct")}</span></div>
      <div><b>${game.best}</b><span>${tr("bestStreak")}</span></div>
    </div>`;
  view.innerHTML = `<p class="go">GAME OVER</p>${stats}<p class="empty">${tr("boardLoading")}</p>`;
  await fetchBoard();
  if (boardOk && qualifies(game.score)) {
    let last = "AAA";
    try { last = localStorage.getItem("gc-last-name") || "AAA"; } catch (e) {}
    const letters = last.split("");
    let slot = 0;
    view.innerHTML = `<p class="go">GAME OVER</p>${stats}
      <p class="newhi blink">${tr("newHi")}</p>
      <p class="center" style="padding-bottom:14px">${tr("enterInitials")}</p>
      <div class="initials" id="ini">${letters.map((l, i) => `
        <div class="slot" data-i="${i}">
          <button class="arr" data-d="-1" aria-label="${tr("letterPrev")}">▲</button>
          <div class="ch" tabindex="0">${l}</div>
          <button class="arr" data-d="1" aria-label="${tr("letterNext")}">▼</button>
        </div>`).join("")}</div>
      <div style="text-align:center;margin-top:22px"><button class="primary" id="save">${tr("save")}</button></div>
      <p class="hint" id="err" style="color:var(--bad)"></p>
      <p class="hint" style="margin-top:16px">${tr("keysHint")}</p>`;
    const slots = [...view.querySelectorAll(".slot")];
    const draw = () => slots.forEach((s, i) => { s.querySelector(".ch").textContent = letters[i]; s.classList.toggle("act", i === slot); });
    const step = (i, d) => { const k = ABC.indexOf(letters[i]); letters[i] = ABC[(k + d + ABC.length) % ABC.length]; draw(); };
    slots.forEach((s, i) => {
      s.querySelectorAll(".arr").forEach(a => a.onclick = () => { slot = i; step(i, +a.dataset.d); });
      s.querySelector(".ch").onclick = () => { slot = i; draw(); };
    });
    let saving = false;
    const save = async () => {
      if (saving) return;
      saving = true;
      const btn = document.getElementById("save");
      btn.textContent = tr("saving"); btn.disabled = true;
      const name = letters.join("");
      try { localStorage.setItem("gc-last-name", name); } catch (e) {}
      try {
        const id = await submitScore(name);
        document.removeEventListener("keydown", onKey);
        await fetchBoard();
        showResults(stats, id);
      } catch (e) {
        saving = false;
        btn.textContent = tr("retry"); btn.disabled = false;
        document.getElementById("err").textContent = tr("saveErr");
      }
    };
    const onKey = e => {
      const k = e.key.toUpperCase();
      if (k.length === 1 && ABC.includes(k)) { letters[slot] = k; slot = Math.min(2, slot + 1); draw(); e.preventDefault(); }
      else if (e.key === "ArrowLeft") { slot = Math.max(0, slot - 1); draw(); e.preventDefault(); }
      else if (e.key === "ArrowRight") { slot = Math.min(2, slot + 1); draw(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { step(slot, -1); e.preventDefault(); }
      else if (e.key === "ArrowDown") { step(slot, 1); e.preventDefault(); }
      else if (e.key === "Backspace") { slot = Math.max(0, slot - 1); draw(); e.preventDefault(); }
      else if (e.key === "Enter") { save(); e.preventDefault(); }
    };
    document.addEventListener("keydown", onKey);
    document.getElementById("save").onclick = save;
    draw();
  } else {
    showResults(stats, null);
  }
}

function showResults(stats, highlightId) {
  const misses = game.misses;
  view.innerHTML = `<p class="go">GAME OVER</p>${stats}
    <h3 class="sub">${tr("leaderboard")}</h3>${boardHTML(highlightId)}
    <div class="actions"><button class="primary" id="again">${tr("again")}</button><a class="ghost" href="${HOME_URL}?lang=${LANG}">${tr("otherGenres")}</a></div>
    ${misses.length ? `<h3 class="sub" style="margin-top:30px">${tr("mistakes")}</h3>${misses.map(explain).join("")}` : ""}`;
  document.getElementById("again").onclick = startGame;
  document.getElementById("again").focus({ preventScroll: true });
}

// ---------- Start ----------
function startGame() {
  stop();
  game = { score: 0, lives: LIVES, streak: 0, best: 0, correct: 0, n: 0, used: new Set(), misses: [] };
  nextQuestion();
}
function startScreen() {
  stop(); game = null; drawHud();
  view.innerHTML = `<p class="start-title">${tr("startTitle")}</p>
    <div class="rules">
      <p><b>♥ ♥ ♥</b> ${tr("ruleLives")}</p>
      <p><b>⏱</b> ${tr("ruleSpeed", BONUS_MAX)}</p>${EXTRA_RULE[LANG]}
      <p><b>×4</b> ${tr("ruleStreak")}</p>
    </div>
    <div style="text-align:center"><button class="primary" id="go">START ▸</button></div>
    <p class="center blink" style="font-family:var(--px);font-size:10px;padding:22px 0 6px">${tr("pressStart")}</p>
    <h3 class="sub">${tr("leaderboard")}</h3><div id="boardbox">${boardHTML(null)}</div>`;
  document.getElementById("go").onclick = startGame;
  fetchBoard().then(() => { const box = document.getElementById("boardbox"); if (box) box.innerHTML = boardHTML(null); });
}
startScreen();
</script>
